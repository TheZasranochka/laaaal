# /etc/nginx/sites-available/ai-dms
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;   # замените на ваш домен (или _ для любого хоста)

    client_max_body_size 16m;

    # Статику отдаёт nginx напрямую, минуя приложение.
    location /static/ {
        alias /opt/ai-dms/static/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ответ GigaChat бывает долгим — таймаут должен превышать gunicorn timeout.
        proxy_connect_timeout 5s;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
    }
}
