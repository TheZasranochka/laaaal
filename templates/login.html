<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — AI ассистент ДМС</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo"><span class="dot">🩺</span> AI ассистент ДМС</div>
        <h1>С возвращением</h1>
        <p class="auth-sub">Войдите, чтобы продолжить консультацию по ДМС.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, m in messages %}<div class="flash {{ 'ok' if category == 'success' else '' }}">{{ m }}</div>{% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@sber.ru" required autofocus>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary">Войти</button>
        </form>

        <div class="auth-alt">
            Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a>
        </div>
    </div>
</div>
</body>
</html>
