<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат — AI ассистент ДМС</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .chat-header .auth { font-size: 13px; color: #6b7280; margin-right: 12px; white-space: nowrap; }
        .chat-header .auth a { color: inherit; text-decoration: underline; }
        .msg.bot code { background: rgba(0,0,0,.06); padding: 1px 4px; border-radius: 4px; font-size: .9em; }
        .msg.bot strong { font-weight: 700; }
        .msg.note { background: #fff7ed; color: #9a3412; font-size: 13px; }
    </style>
</head>
<body>
    <div class="chatgpt">
        <div class="chat-header">
            <span class="dot">🩺</span>
            <div>
                <div class="title">AI ассистент ДМС</div>
                <div class="status">● онлайн</div>
            </div>
            <span class="spacer"></span>
            <span class="auth" id="authState"></span>
            <button class="link" id="clear" title="Очистить диалог">Очистить</button>
            <a href="/">На главную</a>
        </div>

        <div class="chatgpt-messages" id="messages">
            <div class="msg bot">Здравствуйте! Я ваш AI-помощник по ДМС ПАО Сбербанк. Задайте вопрос о вашей страховой программе — например, что входит в покрытие или как получить направление. 👋</div>
        </div>

        <div class="chatgpt-input">
            <textarea id="input" rows="1" placeholder="Введите вопрос…" autocomplete="off"></textarea>
            <button id="send" disabled>➤</button>
        </div>
    </div>

    <script>
        const LOGGED_IN = {{ 'true' if current_user.is_authenticated else 'false' }};
        const USER_EMAIL = {{ (current_user.email | tojson) if current_user.is_authenticated else 'null' }};

        const msgBox = document.getElementById('messages'),
              input  = document.getElementById('input'),
              btn    = document.getElementById('send'),
              clearBtn = document.getElementById('clear'),
              authEl = document.getElementById('authState');

        // Минимальный безопасный рендер markdown: сначала экранируем HTML,
        // затем включаем **жирный**, `код`, заголовки, маркеры и переносы строк.
        function renderMarkdown(text) {
            const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const lines = (text || '').split('\n').map(line => {
                let l = esc(line);
                l = l.replace(/^\s*#{1,6}\s+(.*)$/, '<strong>$1</strong>');  // ### Заголовок
                l = l.replace(/^\s*[-*]\s+/, '• ');                          // - пункт
                return l;
            });
            let html = lines.join('<br>');
            html = html.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>'); // **жирный**
            html = html.replace(/`([^`]+?)`/g, '<code>$1</code>');           // `код`
            return html;
        }

        function addMsg(role, text, sources = []) {
            const d = document.createElement('div');
            d.className = `msg ${role}`;
            if (role === 'bot') d.innerHTML = renderMarkdown(text);
            else d.textContent = text;
            if (sources.length) {
                const s = document.createElement('div');
                s.className = 'sources';
                s.innerHTML = '<b>Источники:</b> ' +
                    sources.map(x => `<a href="${x.url||'#'}" target="_blank" rel="noopener">${x.title||x}</a>`).join(', ');
                d.appendChild(s);
            }
            msgBox.appendChild(d);
            msgBox.scrollTop = msgBox.scrollHeight;
            return d;
        }

        // Подтянуть историю аккаунта при загрузке (только для вошедших).
        async function loadHistory() {
            if (!LOGGED_IN) return;
            try {
                const res = await fetch('/api/get_dialog_history');
                if (!res.ok || res.redirected) return;
                const data = await res.json();
                const hist = data.history || [];
                if (!hist.length) return;
                msgBox.innerHTML = '';
                addMsg('note', '🕑 Ваша сохранённая история переписки:');
                for (const h of hist) {
                    if (h.message)  addMsg('user', h.message);
                    if (h.response) addMsg('bot', h.response);
                }
            } catch (e) { /* нет истории — ничего страшного */ }
        }

        function autoGrow() {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 160) + 'px';
        }

        async function send() {
            const txt = input.value.trim();
            if (!txt) return;
            addMsg('user', txt);
            input.value = ''; autoGrow();
            btn.disabled = true; input.disabled = true;
            const loader = addMsg('bot', 'Думаю', []); loader.classList.add('typing');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: txt })
                });
                const data = await res.json();
                loader.remove();
                if (res.ok) addMsg('bot', data.response, (data.sources||[]).map(s => ({title: s})));
                else addMsg('bot', data.error || 'Ошибка сервера. Попробуйте позже.');
            } catch (e) {
                loader.remove();
                addMsg('bot', 'Ошибка сети. Проверьте подключение.');
            } finally {
                btn.disabled = false; input.disabled = false; input.focus();
            }
        }

        async function clearChat() {
            try { await fetch('/chat/clear', { method: 'POST' }); } catch (e) {}
            msgBox.innerHTML = '';
            addMsg('bot', 'Диалог очищен. Чем могу помочь?');
        }

        // Индикатор входа в шапке
        if (LOGGED_IN) {
            authEl.innerHTML = `👤 ${USER_EMAIL} · <a href="/logout">Выход</a>`;
        } else {
            authEl.innerHTML = `<a href="/login">Войти</a>, чтобы сохранять историю`;
        }

        input.addEventListener('input', () => { btn.disabled = !input.value.trim(); autoGrow(); });
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });
        btn.addEventListener('click', send);
        clearBtn.addEventListener('click', clearChat);

        loadHistory();
        input.focus();
    </script>
</body>
</html>
